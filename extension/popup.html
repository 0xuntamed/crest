<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crest</title>
    <style>
      :root {
        --paper: #f4f0e8;
        --card: #fbf9f4;
        --ink: #17140f;
        --ink-2: #4b453b;
        --ink-3: #8a8274;
        --rule: #dad2c2;
        --wax: #00b1fa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #13110e;
          --card: #191713;
          --ink: #efe9dd;
          --ink-2: #bdb4a4;
          --ink-3: #7d7668;
          --rule: #2e2a24;
          --wax: #00b1fa;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 340px;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--rule); }
      header h1 { margin: 0; font: 400 24px/1 "Instrument Serif", Georgia, serif; }
      header span { margin-left: auto; font: 500 10.5px ui-monospace, monospace; letter-spacing: 0.12em; color: var(--ink-3); text-transform: uppercase; }
      section { padding: 12px 16px; }
      .label { font: 500 10.5px ui-monospace, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
      .hint { color: var(--ink-2); font-size: 12.5px; margin: 0; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { border-top: 1px solid var(--rule); }
      li:first-child { border-top: 0; }
      li a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 0; color: inherit; text-decoration: none; }
      li a:hover .t { color: var(--wax); }
      .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
      .tag { flex-shrink: 0; font: 500 10px ui-monospace, monospace; text-transform: uppercase; letter-spacing: 0.08em; padding: 3px 8px; border-radius: 999px; background: var(--rule); color: var(--ink-2); }
      .tag.sealed { background: var(--wax); color: #17140f; }
      .row { display: flex; gap: 6px; }
      input { flex: 1; min-width: 0; padding: 7px 9px; border-radius: 9px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); font: 12px ui-monospace, monospace; outline: none; }
      button { padding: 7px 12px; border-radius: 999px; border: 0; background: var(--wax); color: #17140f; font-weight: 600; cursor: pointer; }
      .muted { color: var(--ink-3); font-size: 12px; }
      footer { padding: 10px 16px 14px; border-top: 1px solid var(--rule); }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/48.png" width="20" height="20" alt="" />
      <h1>Crest</h1>
      <span>for Google Docs</span>
    </header>
    <section>
      <p class="hint">Open a Google Doc and press <b>Record with Crest</b>. Nothing is recorded until you do.</p>
    </section>
    <section>
      <div class="label">Your recordings</div>
      <ul id="list"><li class="muted">Loading…</li></ul>
    </section>
    <footer>
      <div class="label">Crest server</div>
      <form class="row" id="site-form">
        <input id="site" type="url" required placeholder="https://crest.example.com" />
        <button type="submit">Save</button>
      </form>
      <div id="site-msg" class="muted" style="margin-top: 6px"></div>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
